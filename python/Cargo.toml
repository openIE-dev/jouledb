[package]
name = "jouledb-python"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native core of the jouledb Python SDK"
publish = false

# Standalone: built by maturin, not part of the engine workspace.
[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
