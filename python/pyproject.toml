[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "jouledb"
version = "0.1.0"
description = "Python SDK for JouleDB: query results as Arrow, pandas or polars, with the energy receipt"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = ["pyarrow>=12"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
test = ["pytest", "pandas", "polars"]

[tool.maturin]
python-source = "python"
module-name = "jouledb._native"
features = ["pyo3/extension-module"]
