[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "jouledb"
version = "0.18.0"
description = "Python SDK for JouleDB: query results as Arrow, pandas or polars, with per-query hardware energy receipts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "openIE-dev" }]
keywords = [
    "database",
    "postgresql",
    "arrow",
    "vector-search",
    "ledger",
    "energy",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyarrow>=12"]

[project.urls]
Homepage = "https://jouledb.org"
Documentation = "https://jouledb.org/docs/"
Repository = "https://github.com/openIE-dev/jouledb"
Issues = "https://github.com/openIE-dev/jouledb/issues"
Changelog = "https://github.com/openIE-dev/jouledb/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
test = ["pytest", "pandas", "polars"]

[tool.maturin]
python-source = "python"
module-name = "jouledb._native"
features = ["pyo3/extension-module"]
