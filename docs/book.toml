[book]
title = "JouleDB"
authors = ["David Charlot <david@openie.dev>"]
description = "JouleDB — energy-metered database, HDC primitives, joules per query."
language = "en"
multilingual = false
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/openIE-dev/jouledb"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/openIE-dev/jouledb/edit/main/docs/{path}"
site-url = "/jouledb/"

[output.html.search]
enable = true

[output.html.fold]
enable = true
