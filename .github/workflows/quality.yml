name: Quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — pick up new advisories
  workflow_dispatch:

jobs:
  stub-checks:
    name: Stub checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Find stub directory
        id: stub
        run: |
          DIR=$(find stubs -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: cargo fmt
        if: steps.stub.outputs.dir
        working-directory: ${{ steps.stub.outputs.dir }}
        run: cargo fmt -- --check

      - name: cargo clippy
        if: steps.stub.outputs.dir
        working-directory: ${{ steps.stub.outputs.dir }}
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo build
        if: steps.stub.outputs.dir
        working-directory: ${{ steps.stub.outputs.dir }}
        run: cargo build --release --locked

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find stub directory
        id: stub
        run: |
          DIR=$(find stubs -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Audit
        if: steps.stub.outputs.dir
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ steps.stub.outputs.dir }}

  license-consistency:
    name: License consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check license files are present
        run: |
          set -e
          for f in LICENSE-MIT LICENSE-APACHE COPYRIGHT; do test -f "$f"; done
          grep -q "Apache License" LICENSE-APACHE
          grep -q "MIT License" LICENSE-MIT
          test ! -f LICENSE
          ! grep -rIl "Business Source License" --exclude-dir=.git --exclude=CHANGELOG.md --exclude=README.md --exclude=quality.yml . || (echo "stale BSL text found"; exit 1)
          echo "MIT OR Apache-2.0 files present, no BSL text"
      - name: Check stub Cargo.toml license field
        run: |
          set -e
          for cargo in stubs/*/Cargo.toml; do
            grep -q '^license = "MIT OR Apache-2.0"' "$cargo" || (echo "$cargo missing license field"; exit 1)
            test -f "$(dirname "$cargo")/LICENSE-MIT"
            test -f "$(dirname "$cargo")/LICENSE-APACHE"
          done
          echo "stub license fields valid"
