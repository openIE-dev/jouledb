name: Release

# One install story: every channel ships the same `jouledb` server binary
# (crate joule-db-server, built from this repository).
#   - workflow_dispatch / pull_request / push to main: build + smoke-test every
#     target and keep the archives as workflow artifacts (nothing is published).
#   - push of a v* tag: the same, then publish a GitHub Release with the
#     archives and sha256 files. Tags are cut by a maintainer.
# Archive layout matches stubs/jouledb's [package.metadata.binstall]:
#   jouledb-<version>-<target>.tar.gz -> jouledb-<version>-<target>/jouledb

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml', 'Dockerfile', 'packaging/**']
  pull_request:
    paths: ['.github/workflows/release.yml', 'Dockerfile', 'packaging/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.94.1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      os: macos-14 }
          # Intel macOS runners are gone; cross-compile on Apple silicon (smoke test runs under Rosetta).
          - { target: x86_64-apple-darwin,       os: macos-14 }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          # Experimental: joule-db-server uses tokio::net::UnixListener without a cfg(unix) gate.
          - { target: x86_64-pc-windows-msvc,    os: windows-latest, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p joule-db-server --bin jouledb
      - name: Smoke test (version, start, /health, pgwire port)
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/jouledb
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version
          "$BIN" -p 18080 -d "$RUNNER_TEMP/jdb" > "$RUNNER_TEMP/srv.log" 2>&1 &
          for i in $(seq 60); do curl -fsS http://127.0.0.1:18080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS -X POST http://127.0.0.1:18080/api/v1/query -H 'content-type: application/json' -d '{"sql":"SELECT 1 + 1"}' || true
          (echo > /dev/tcp/127.0.0.1/18082) && echo "pgwire listening"
      - name: Package
        shell: bash
        run: |
          VERSION=$(cargo pkgid -p joule-db-server | sed 's/.*[#@]//')
          case "$GITHUB_REF" in refs/tags/v*) VERSION="${GITHUB_REF#refs/tags/v}";; esac
          BASE="jouledb-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$BASE"
          cp target/${{ matrix.target }}/release/jouledb* "dist/$BASE/" 2>/dev/null || true
          rm -f "dist/$BASE"/*.d "dist/$BASE"/*.pdb
          cp LICENSE README.md "dist/$BASE/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$BASE.zip" "$BASE" >/dev/null && sha256sum "$BASE.zip" > "$BASE.zip.sha256"
          else
            tar czf "$BASE.tar.gz" "$BASE" && shasum -a 256 "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          fi
          rm -rf "$BASE"; ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: jouledb-${{ matrix.target }}
          path: dist/*

  docker:
    name: Docker image (build + smoke, not pushed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t jouledb:ci .
      - name: Smoke
        run: |
          docker run -d --name jdb -e JOULEDB_JWT_SECRET=ci-secret -p 18080:8080 -p 18082:8082 jouledb:ci
          for i in $(seq 60); do curl -fsS http://127.0.0.1:18080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/health
          sudo apt-get install -y -q postgresql-client >/dev/null
          PGPASSWORD=ci-secret psql "host=127.0.0.1 port=18082 user=postgres dbname=postgres sslmode=disable" -Atc "SELECT version()"
          docker logs jdb | tail -20
      - name: Save image as artifact
        run: docker save jouledb:ci | gzip > jouledb-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jouledb-docker-image
          path: jouledb-image.tar.gz

  release:
    name: Publish GitHub Release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: jouledb-*-*
      - run: mkdir dist && find artifacts -type f -exec mv {} dist/ \; && ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
