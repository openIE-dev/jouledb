name: Release

# One install story: every channel ships the same `jouledb` server binary
# (crate joule-db-server, built from this repository).
#   - workflow_dispatch / pull_request: build + smoke-test every target and keep
#     the archives as workflow artifacts (nothing is published).
#   - push of a v* tag: the same, then publish a GitHub Release with the
#     archives and sha256 files. Tags are cut by a maintainer.
# Archive layout matches stubs/jouledb's [package.metadata.binstall]:
#   jouledb-<version>-<target>.tar.gz -> jouledb-<version>-<target>/jouledb

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'Dockerfile', 'packaging/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.94.1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      os: macos-15 }
          # Intel macOS runners are retired; cross-compile on Apple silicon.
          - { target: x86_64-apple-darwin,       os: macos-15 }
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          # Experimental: joule-db-server uses tokio::net::UnixListener without a cfg(unix) gate.
          - { target: x86_64-pc-windows-msvc,    os: windows-latest, experimental: true }
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p joule-db-server --bin jouledb
      - name: Smoke test (version, start, /health, pgwire port)
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/jouledb
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license || { file "$BIN" | grep -q x86_64 && exit 0; }
          fi
          "$BIN" --version
          "$BIN" -p 18080 -d "$RUNNER_TEMP/jdb" > "$RUNNER_TEMP/srv.log" 2>&1 &
          for i in $(seq 60); do curl -fsS http://127.0.0.1:18080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS -X POST http://127.0.0.1:18080/api/v1/query -H 'content-type: application/json' -d '{"sql":"SELECT 1 + 1"}' || true
          (echo > /dev/tcp/127.0.0.1/18082) && echo "pgwire listening"
      - name: Package
        shell: bash
        run: |
          VERSION=$(cargo pkgid -p joule-db-server | sed 's/.*[#@]//')
          case "$GITHUB_REF" in refs/tags/v*) VERSION="${GITHUB_REF#refs/tags/v}";; esac
          BASE="jouledb-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$BASE"
          cp target/${{ matrix.target }}/release/jouledb* "dist/$BASE/" 2>/dev/null || true
          rm -f "dist/$BASE"/*.d "dist/$BASE"/*.pdb
          cp LICENSE-MIT LICENSE-APACHE COPYRIGHT README.md "dist/$BASE/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$BASE.zip" "$BASE" >/dev/null && sha256sum "$BASE.zip" > "$BASE.zip.sha256"
          else
            tar czf "$BASE.tar.gz" "$BASE" && shasum -a 256 "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          fi
          rm -rf "$BASE"; ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: jouledb-bin-${{ matrix.target }}
          path: dist/*

  docker:
    name: Docker image (build, smoke + GHCR push on tags)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: Build
        run: docker build -t jouledb:ci .
      - name: Smoke
        run: |
          docker run -d --name jdb -e JOULEDB_JWT_SECRET=ci-secret -p 18080:8080 -p 18082:8082 jouledb:ci
          for i in $(seq 60); do curl -fsS http://127.0.0.1:18080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/health
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client >/dev/null
          PGPASSWORD=ci-secret psql "host=127.0.0.1 port=18082 user=postgres dbname=postgres sslmode=disable" -Atc "SELECT version()"
          docker logs jdb | tail -20
      - name: Save image as artifact
        run: docker save jouledb:ci | gzip > jouledb-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jouledb-docker-image
          path: jouledb-image.tar.gz
      - name: Push GHCR image (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || exit 0
          docker tag jouledb:ci "ghcr.io/${REPO_LC}:${VER}"
          docker tag jouledb:ci "ghcr.io/${REPO_LC}:latest"
          docker push "ghcr.io/${REPO_LC}:${VER}" || true
          docker push "ghcr.io/${REPO_LC}:latest" || true

  wheels:
    name: python-wheel-${{ matrix.os }}-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   target: x86_64,  sdist: true }
          - { os: ubuntu-24.04-arm, target: aarch64, sdist: false }
          - { os: macos-15,        target: aarch64, sdist: false }
          - { os: macos-15,        target: x86_64,  sdist: false }
          - { os: windows-latest,  target: x64,     sdist: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --out dist ${{ matrix.sdist && '--sdist' || '' }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: jouledb-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin-artifacts
          pattern: jouledb-bin-*
      - uses: actions/download-artifact@v4
        with:
          path: wheel-artifacts
          pattern: jouledb-wheel-*
      - run: |
          mkdir -p dist pypi-dist
          find bin-artifacts -type f -exec cp {} dist/ \;
          find wheel-artifacts -type f -exec cp {} pypi-dist/ \;
          cp pypi-dist/* dist/
          ls -la dist pypi-dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Publish Python wheels to PyPI (OIDC Trusted Publisher when configured)
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/
          skip-existing: true
