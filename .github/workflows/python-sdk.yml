name: Python SDK

# Builds the `jouledb` wheels (abi3, one per platform) and runs the SDK tests
# against a release server. Wheels are uploaded as workflow artifacts only;
# nothing is published to PyPI.

on:
  push:
    branches: [main]
    paths: ["python/**", "crates/joule-db-server/**", ".github/workflows/python-sdk.yml"]
  pull_request:
    branches: [main]
    paths: ["python/**", ".github/workflows/python-sdk.yml"]
  workflow_dispatch:

concurrency:
  group: python-sdk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.94.1

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-14
            target: aarch64
          - os: macos-14
            target: x86_64
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: jouledb-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pg-clients
      - name: Build jouledb (release)
        run: cargo build --release --locked -p joule-db-server --bin jouledb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest pandas polars pyarrow duckdb 'psycopg[binary]'
          cd python && maturin develop --release
      - name: Test against a live server
        run: |
          mkdir -p "$RUNNER_TEMP/copy"
          JOULEDB_COPY_DIR="$RUNNER_TEMP/copy" ./target/release/jouledb -p 18080 -d "$RUNNER_TEMP/db" > "$RUNNER_TEMP/srv.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null -X POST localhost:18080/api/v1/query -H 'content-type: application/json' -d '{"sql":"SELECT 1"}' && break; sleep 1; done
          . .venv/bin/activate
          JOULEDB_COPY_DIR="$RUNNER_TEMP/copy" JOULEDB_PG_PORT=18082 JOULEDB_URL=http://localhost:18080 pytest -v python/tests
      - if: failure()
        run: tail -100 "$RUNNER_TEMP/srv.log"
