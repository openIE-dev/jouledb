name: Bug report
description: Report a bug
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill out the sections below so we can reproduce + fix it.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `<tool> --version`
      placeholder: ex. v0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, architecture, hardware notes
      placeholder: ex. macOS 26.5, Apple M4 Max
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce
      placeholder: |
        1. Run `<tool> ...`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `RUST_LOG=debug` if helpful
      render: shell
