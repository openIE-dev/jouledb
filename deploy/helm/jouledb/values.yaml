replicaCount: 3

image:
  repository: ghcr.io/openie-dev/jouledb
  tag: "0.17.0"
  pullPolicy: IfNotPresent

# Progressive Trust Tier: maker | consumer | soc2 | regulated | industrial | sovereign-mls
trustTier: "soc2"

ports:
  http: 8080
  tcp: 8081
  pgwire: 8082
  jwp: 8083
  flightsql: 8084

persistence:
  enabled: true
  size: 100Gi
  storageClass: ""
  wormRetentionDays: 2555 # SEC 17a-4(f) 7-year lock when trustTier >= regulated

networkPolicy:
  enabled: true
  airgapEgress: false

podDisruptionBudget:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "8000m"
    memory: "16Gi"
