[package]
name = "joule-db-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
joule-db-core = { path = "..", default-features = false }

# Prevent this from joining the workspace
[workspace]

[[bin]]
name = "fuzz_value_decode"
path = "fuzz_targets/fuzz_value_decode.rs"
doc = false

[[bin]]
name = "fuzz_value_roundtrip"
path = "fuzz_targets/fuzz_value_roundtrip.rs"
doc = false
