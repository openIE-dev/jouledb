[package]
name = "jouledb"
version = "0.19.0"
edition = "2021"
rust-version = "1.74"
description = "Energy-metered multi-model Rust database (0.19.0 pre-1.0 preview) — durable NVMe double-entry ledger, sub-millisecond lazy CoW SQL branching, Kinetic Ontology Actions, JouleRoute quota waterfall, Orthogonal Super-Adapters, DuckLake/Lance Blob v2, SQL AI_* functions, and pure-.jcol analytics. `cargo binstall jouledb` fetches the binary."
license = "MIT OR Apache-2.0"
repository = "https://github.com/openIE-dev/jouledb"
homepage = "https://jouledb.org"
documentation = "https://openie-dev.github.io/jouledb"
readme = "../../README.md"
keywords = ["database", "ai", "energy", "jsyn", "rust"]
categories = ["command-line-utilities", "database", "science"]

# Standalone package — not in jouledb's workspace
[workspace]

[[bin]]
name = "jouledb"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/jouledb-{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "jouledb-{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
